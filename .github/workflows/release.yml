name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set product version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
            version="${REF_NAME#v}"
            echo "TIANZIGE_VERSION=${version%%-*}" >> "$GITHUB_ENV"
          fi
          echo "TIANZIGE_BUILD=$((RUN_NUMBER + 3))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: services/homework-server/go.sum
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Restore existing Android signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build and verify TV
        working-directory: apps/tv-android
        run: |
          sh gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/tianzige-tv-debug.apk
      - name: Test and package NAS
        run: |
          make -C services/homework-server test bundle bundle-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: |
            dist/tianzige-tv-debug.apk
            dist/tianzige-nas-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

  apple:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set product version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
            version="${REF_NAME#v}"
            echo "TIANZIGE_VERSION=${version%%-*}" >> "$GITHUB_ENV"
          fi
          echo "TIANZIGE_BUILD=$((RUN_NUMBER + 3))" >> "$GITHUB_ENV"
      - name: Build Apple apps with installed Xcode
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          sh scripts/build-apple.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-release
          path: |
            dist/TianzigeMac.zip
            dist/Tianzige-iOS-unsigned.zip
            dist/Tianzige-*.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [linux, apple]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release-assets
        run: |
          sha256sum ./* > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          ## 安装包
          - `tianzige-tv-debug.apk`：Android TV 8.0+，沿用现有调试签名，可覆盖已有安装。
          - `TianzigeMac.zip`：macOS 13+，本地签名，未公证。
          - `Tianzige-*.ipa` / `Tianzige-iOS-unsigned.zip`：iOS 16+，未签名，供自行签名或 LiveContainer 导入。
          - `tianzige-nas-linux-arm64.tar.gz` / `amd64.tar.gz`：NAS 部署包，包含服务、网页与配置说明，不包含运行数据和密钥。
          - `SHA256SUMS.txt`：下载文件的 SHA-256 校验值。

          升级 NAS 请保留现有 data/ 与 server.env。Apple 客户端预设本家庭的 NAS 地址，其他环境需在设置中修改。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.apk ./*.zip ./*.ipa ./*.tar.gz SHA256SUMS.txt --clobber
          else
            args=()
            [[ "$RELEASE_TAG" != *-* ]] || args+=(--prerelease)
            gh release create "$RELEASE_TAG" ./*.apk ./*.zip ./*.ipa ./*.tar.gz SHA256SUMS.txt \
              --verify-tag --title "家里的田字格 $RELEASE_TAG" --notes-file release-notes.md --generate-notes "${args[@]}"
          fi
