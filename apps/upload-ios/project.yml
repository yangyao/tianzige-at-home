# XcodeGen 工程描述。改完这个文件后重新跑 `xcodegen` 即可，不要手改 .xcodeproj。
#
#   brew install xcodegen
#   cd apps/upload-ios
#   xcodegen
#   open Tianzige.xcodeproj
name: Tianzige

options:
  bundleIdPrefix: com.tianzige
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.0"
  # 英文是开发语言（也是 fallback）：非中文系统一律落到 en，中文系统走 zh-Hans。
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 家庭自用工具，不引入严格并发检查，否则 URLSession / UIImage 的旧接口会刷一屏告警
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Tianzige:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Resources 单独列出来：XcodeGen 会把 en.lproj / zh-Hans.lproj 里同名文件
      # 合成一个 PBXVariantGroup，buildPhase 固定为 resources，不会当成源码编译。
      - path: Tianzige
        excludes:
          - "App/Info.plist"
          - "Resources"
      - path: Tianzige/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Tianzige
        PRODUCT_BUNDLE_IDENTIFIER: com.tianzige.ios
        INFOPLIST_FILE: Tianzige/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_LANGUAGE: en
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Tianzige:
    build:
      targets:
        Tianzige: all
    run:
      config: Debug
    archive:
      config: Release
