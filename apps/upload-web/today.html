<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天的作业 · 家里的田字格</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    /* 设计 token，见 design/tokens.json */
    --bg:#14181C; --surface:#1D2329; --raised:#262E36;
    --text:#F2F5F8; --text2:#A8B2BE; --dim:#6F7B88;
    --accent:#E9B44C; --accent-ink:#1A1206; --brand:#3E7A5E; --flower:#D9544D;
    --ok:#4CAF7D; --warn:#E9A23B; --err:#D9544D;
    --line:rgba(255,255,255,.09);
    --r-sm:8px; --r-md:12px; --r-lg:20px; --r-full:999px;
    --tv-display:72px; --tv-h1:52px; --tv-h2:42px; --tv-body:34px; --tv-cap:25px; --tv-min:22px;
    --motion:120ms ease-out;
  }
  html, body {
    height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased;
  }
  /* 固定 1920×1080 画布，等比缩放适配任意屏幕 */
  #stage {
    position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    margin:-540px 0 0 -960px; transform-origin:center center;
  }
  .tv {
    width:1920px; height:1080px; background:var(--bg); color:var(--text);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    padding:48px 60px 0;
  }

  /* ---------------- 顶栏 ---------------- */
  .topbar { display:flex; align-items:flex-end; gap:24px; height:96px; flex:none; }
  .topbar h1 { font-size:var(--tv-h1); font-weight:700; letter-spacing:1px; line-height:1; }
  .topbar .sub { font-size:var(--tv-cap); color:var(--text2); padding-bottom:6px; }
  .topbar .right { margin-left:auto; display:flex; align-items:center; gap:14px; padding-bottom:6px; }
  .chip {
    font-size:var(--tv-min); color:var(--text2); background:var(--surface);
    border:1px solid var(--line); padding:8px 18px; border-radius:var(--r-full);
    white-space:nowrap;
  }
  .chip.rel { color:#F0A8A3; background:rgba(217,84,77,.12); border-color:rgba(217,84,77,.3); }
  .chip.stale { color:var(--warn); background:rgba(233,162,59,.1); border-color:rgba(233,162,59,.32); }
  .chip.off { color:var(--dim); }

  /* ---------------- 本周日期条 ---------------- */
  .week { display:flex; align-items:center; gap:14px; margin-top:24px; height:104px; flex:none; }
  .nav {
    width:56px; height:100px; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:34px; flex:none; border-radius:var(--r-md);
    cursor:pointer; transition:color var(--motion), background var(--motion);
  }
  .nav:hover { color:var(--text2); background:rgba(255,255,255,.03); }
  .days { display:flex; gap:14px; }
  .day {
    width:222px; height:100px; border-radius:var(--r-md); background:var(--surface);
    border:4px solid transparent; box-shadow:inset 0 0 0 1px var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    position:relative; cursor:pointer;
    transition:transform var(--motion), border-color var(--motion), box-shadow var(--motion), background var(--motion);
  }
  .day .w { font-size:var(--tv-min); color:var(--text2); line-height:1; }
  .day .d { font-size:var(--tv-h2); font-weight:600; line-height:1.05; font-variant-numeric:tabular-nums; }
  .day.today { background:rgba(62,122,94,.22); box-shadow:inset 0 0 0 1px rgba(62,122,94,.45); }
  .day.today .w { color:#A9D8BF; }
  .day.future { opacity:.55; }
  .day.sel {
    border-color:var(--accent); background:var(--raised);
    box-shadow:0 0 0 8px rgba(233,180,76,.16);
    transform:scale(1.03); z-index:2;
  }
  .day.sel .w { color:var(--text2); }
  .dot {
    position:absolute; top:10px; right:12px; width:11px; height:11px;
    border-radius:var(--r-full); background:var(--flower);
  }

  /* ---------------- 内容区 ---------------- */
  .content { flex:1; display:flex; gap:44px; margin-top:26px; min-height:0; }

  .figure { flex:0 0 58%; min-width:0; display:flex; min-height:0; }
  .photo {
    flex:1; min-height:0; border-radius:var(--r-lg); overflow:hidden;
    background:var(--surface); border:1px solid var(--line); position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .photo img { width:100%; height:100%; object-fit:contain; display:block; }
  .tag {
    position:absolute; top:18px; right:20px; font-size:var(--tv-min); color:#E7EEF7;
    background:rgba(10,14,20,.72); padding:8px 16px; border-radius:var(--r-sm); letter-spacing:1px;
  }
  .ph {
    display:flex; flex-direction:column; align-items:center; gap:12px;
    font-size:var(--tv-cap); color:var(--dim); text-align:center; padding:24px;
  }
  .ph .box {
    width:88px; height:88px; border-radius:var(--r-md); border:2px dashed rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--dim);
  }
  .ph .t2 { font-size:var(--tv-min); color:var(--dim); }

  /* 原图网格（识别中） */
  .grid {
    flex:1; min-height:0; display:grid; gap:18px; grid-auto-rows:1fr; padding:2px;
  }
  .cell {
    border:4px solid transparent; border-radius:var(--r-lg); background:var(--surface);
    box-shadow:inset 0 0 0 1px var(--line); overflow:hidden;
    display:flex; align-items:center; justify-content:center; min-height:0;
    transition:border-color var(--motion), box-shadow var(--motion), transform var(--motion);
  }
  .cell img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .cell.cur { border-color:var(--accent); box-shadow:0 0 0 8px rgba(233,180,76,.16); transform:scale(1.01); }
  .cell .ph { font-size:var(--tv-min); }

  .text { flex:1; min-width:0; display:flex; flex-direction:column; padding-top:4px; }
  .subject { display:flex; align-items:baseline; gap:16px; }
  .subject .name { font-size:var(--tv-h1); font-weight:700; letter-spacing:1px; }
  .subject .idx { font-size:var(--tv-cap); color:var(--dim); }
  .rule { height:2px; background:var(--line); margin:18px 0 26px; flex:none; }
  .lines { flex:1; overflow:hidden; }
  .lines p { font-size:var(--tv-h2); line-height:1.62; margin-bottom:24px; letter-spacing:.5px; }
  .lines p .num { color:var(--accent); font-weight:600; margin-right:14px; font-variant-numeric:tabular-nums; }
  .lines p.muted { color:var(--text2); font-size:var(--tv-body); line-height:1.7; }
  .caption { margin-top:auto; padding-top:14px; font-size:var(--tv-cap); color:var(--dim); text-align:right; }
  .caption em { font-style:normal; color:var(--text2); }

  /* ---------------- 空状态 ---------------- */
  .empty {
    position:absolute; left:60px; right:60px; top:280px; bottom:66px;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; text-align:center;
  }
  .empty .big { font-size:var(--tv-display); font-weight:700; color:var(--text2); letter-spacing:2px; }
  .empty .small { font-size:var(--tv-body); color:var(--dim); }
  .tv.is-empty .content { visibility:hidden; }
  .tv.is-empty .empty { display:flex; }
  .tv.loading .content, .tv.loading .empty { opacity:.5; transition:opacity 200ms ease-out; }

  /* ---------------- 底栏 ---------------- */
  .foot {
    height:66px; display:flex; align-items:center; gap:36px; flex:none;
    font-size:var(--tv-cap); color:var(--dim);
  }
  .foot .k { display:flex; align-items:center; gap:10px; }
  .foot .cap {
    background:var(--raised); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:5px 12px; font-size:var(--tv-min); color:var(--text2); min-width:44px; text-align:center;
  }

  /* ---------------- 全屏看图 ---------------- */
  .viewer { position:absolute; inset:0; background:#000; display:none; z-index:30; overflow:hidden; }
  .viewer.on { display:block; }
  .viewer .frame { position:absolute; inset:0; overflow:hidden; }
  .viewer img {
    position:absolute; left:50%; top:0; width:1920px; height:auto;
    transform:translate(-50%,0); will-change:transform; display:block;
  }
  .viewer .vph {
    position:absolute; inset:0; display:none; flex-direction:column; gap:16px;
    align-items:center; justify-content:center; color:var(--dim); font-size:var(--tv-body);
  }
  .viewer .bar {
    position:absolute; left:0; right:0; bottom:0; height:88px; z-index:2;
    background:linear-gradient(transparent, rgba(0,0,0,.92));
    display:flex; align-items:center; justify-content:center; gap:40px;
    font-size:var(--tv-cap); color:var(--text2);
  }
  .viewer .bar .k { color:var(--dim); }

  /* ---------------- 演示徽章 ---------------- */
  #demoBadge {
    position:fixed; left:14px; top:12px; z-index:90; display:none;
    font-size:12px; color:var(--warn); background:rgba(233,162,59,.14);
    border:1px solid rgba(233,162,59,.34); border-radius:var(--r-full); padding:4px 11px;
    font-family:system-ui,sans-serif;
  }
  #demoBadge.on { display:block; }

  /* ---------------- 语言切换 ---------------- */
  #langToggle {
    position:fixed; right:14px; bottom:10px; z-index:95;
    display:flex; align-items:center; gap:4px;
    background:none; border:0; color:var(--dim); font-family:system-ui,sans-serif;
    font-size:13px; padding:6px; cursor:pointer; opacity:.7;
  }
  #langToggle .sep { opacity:.45; }
  #langToggle:hover { opacity:1; }
  #langToggle .on { color:var(--text2); font-weight:700; }
</style>
</head>
<body>

<div id="stage">
  <div class="tv" id="tv">

    <div class="topbar">
      <h1 id="title">今天的作业</h1>
      <div class="sub" id="subDate"></div>
      <div class="right">
        <div class="chip rel" id="relChip" style="display:none"></div>
        <div class="chip" id="syncChip" data-i18n="tv.sync.reading">正在读取…</div>
      </div>
    </div>

    <div class="week">
      <div class="nav" id="prevWeek" title="上一周" data-i18n-title="nav.prev">‹</div>
      <div class="days" id="days"></div>
      <div class="nav" id="nextWeek" title="下一周" data-i18n-title="nav.next">›</div>
    </div>

    <div class="content">
      <div class="figure" id="figure"></div>
      <div class="text" id="text"></div>
    </div>

    <div class="empty" id="empty">
      <div class="big" id="emptyBig">今天还没有作业</div>
      <div class="small" id="emptySmall">老师发出来之后，这里会自己出现</div>
    </div>

    <div class="foot">
      <div class="k"><span class="cap">←</span><span class="cap">→</span> <span data-i18n="foot.date">换日期</span></div>
      <div class="k"><span class="cap">↑</span><span class="cap">↓</span> <span id="udHint" data-i18n="foot.subject">换科目</span></div>
      <div class="k"><span class="cap">OK</span> <span data-i18n="foot.view">看大图</span></div>
      <div class="k"><span class="cap" data-i18n="foot.back">返回</span> <span data-i18n="foot.exit">退出</span></div>
    </div>

    <div class="viewer" id="viewer">
      <div class="frame">
        <img id="vimg" alt="作业原图" data-i18n-alt="photo.alt">
        <div class="vph" id="vph"><span data-i18n="viewer.err">这张图暂时打不开</span><span style="font-size:22px" data-i18n="viewer.errsub">可以先看文字</span></div>
      </div>
      <div class="bar">
        <span><span class="k">↑ ↓</span> <span data-i18n="viewer.scroll">滚动</span></span>
        <span><span class="k">Esc</span> <span data-i18n="foot.exit">退出</span></span>
        <span style="color:#6F7B88" data-i18n="viewer.mode">原图全屏 · 以图为准</span>
      </div>
    </div>

  </div>
</div>

<button id="langToggle" type="button" aria-label="切换语言 / Switch language"><span data-lang="zh">中文</span><span class="sep">/</span><span data-lang="en">EN</span></button>
<div id="demoBadge" data-i18n="demo.badge">演示数据</div>

<script>
(function () {
  'use strict';

  /* ================= 文案 ================= */
  var I18N = {
    zh: {
      'page.title': '今天的作业 · 家里的田字格',
      'demo.badge': '演示数据',

      'nav.next': '下一周',

      'tv.ready.caption': '识别结果，仅供参考 · <em>以原图为准</em>',

      'tv.pending.cap': '原图已经存好，不会丢',

      'tv.pending.imgalt': '作业原图 {n}',
      'tv.pending.cellfail': '这张图打不开'
    },
    en: {
      'page.title': "Today's homework · Tianzige",
      'demo.badge': 'Demo data',
      'nav.prev': 'Previous week',
      'nav.next': 'Next week',
      'foot.date': 'Change date',
      'foot.subject': 'Change subject',
      'foot.subject.pending': 'Change photo',
      'foot.view': 'View photo',
      'foot.back': 'Back',
      'foot.exit': 'Exit',
      'photo.alt': 'Original photo',
      'viewer.err': "This photo won't open right now",
      'viewer.errsub': 'Read the text instead',
      'viewer.scroll': 'Scroll',
      'viewer.mode': 'Full-screen photo · always trust it',
      'tv.title.today': "Today's homework",
      'tv.title.yesterday': "Yesterday's homework",
      'tv.title.other': 'Homework for {d}',
      'tv.empty.today': 'No homework yet today',
      'tv.empty.day': 'No homework for this day',
      'tv.empty.sub': 'It shows up here once the teacher posts it',
      'tv.nas.title': "Can't reach the NAS",
      'tv.nas.sub': 'Check that the TV and the NAS are on the same Wi-Fi',
      'tv.nodata.title': "Homework isn't available",
      'tv.nodata.sub': "Can't reach the NAS — check the TV's Wi-Fi",
      'tv.sync.reading': 'Reading…',
      'tv.sync.updated': 'Updated {time}',
      'tv.sync.synced': 'Synced {time}',
      'tv.sync.none': 'Not synced yet',
      'rel.ago': '{n} days ago',
      'rel.in': 'in {n} days',
      'tv.ready.alt': '{subject} — original photo',
      'tv.ready.imgfail': "Photo won't open",
      'tv.ready.imgfail.sub': 'The text is still here — work from that',
      'tv.ready.noimg': 'No photo yet',
      'tv.ready.fallback': 'Homework',
      'tv.idx': 'Item {i} of {n}',
      'tv.ready.noitems': 'No separate items for this subject — just read the photo.',
      'tv.ready.caption': 'Recognized text — <em>always check the photo</em>',
      'tv.pending.name': 'Still reading',
      'tv.pending.idx': 'Photo {i} of {n}',
      'tv.pending.line1': 'Still reading it — the photo is accurate',
      'tv.pending.line2': 'The text shows up in a moment — follow the photo for now.',
      'tv.pending.cap': 'The photo is already saved — nothing will be lost',
      'tv.pending.noimg': 'No photo yet',
      'tv.pending.noimg.sub': 'Waiting for the teacher',
      'tv.pending.imgalt': 'Original photo {n}',
      'tv.pending.cellfail': "This photo won't open"
    }
  };

  var LS_LANG = 'lang';
  var LOCALE = 'en-US';

  function pickLang() {
    var m = /[?&]lang=([a-zA-Z-]+)/.exec(location.search);
    if (m) return /^zh/i.test(m[1]) ? 'zh' : 'en';
    try {
      var s = localStorage.getItem(LS_LANG);
      if (s === 'zh' || s === 'en') return s;
    } catch (e) { /* 隐私模式 */ }
    return /^zh/i.test(String(navigator.language || '')) ? 'zh' : 'en';
  }

  var lang = pickLang();
  LOCALE = lang === 'zh' ? 'zh-CN' : 'en-US';

  function fill(s, params) {
    if (!params) return s;
    return s.replace(/\{(\w+)\}/g, function (m0, k) {
      return params[k] != null ? String(params[k]) : m0;
    });
  }

  function t(key, params) {
    var table = I18N[lang] || I18N.en;
    var s = table[key];
    if (s == null) s = I18N.en[key];
    if (s == null) s = key;
    return fill(s, params);
  }

  /* ================= 科目名映射 ================= */
  var SUBJECT_EN = {
    '语文': 'Chinese',
    '数学': 'Math',
    '英语': 'English',
    '科学': 'Science',
    '道法': 'Civics',
    '其他': 'Other'
  };
  function subjectName(s) {
    if (!s) return '';
    if (lang === 'zh') return s;
    return SUBJECT_EN[s] || s;
  }

  /* ================= 日期工具 ================= */
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayYmd() { return ymd(new Date()); }
  function parseYmd(s) {
    if (!s) return null;
    var p = String(s).split('-');
    if (p.length !== 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
  }
  function addDays(s, n) {
    var d = parseYmd(s); if (!d) return s;
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  function mondayOf(s) {
    var d = parseYmd(s); if (!d) return s;
    var off = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - off);
    return ymd(d);
  }
  function diffDays(a, b) {
    var da = parseYmd(a), db = parseYmd(b);
    if (!da || !db) return 0;
    return Math.round((da - db) / 86400000);
  }
  function hm(d) {
    if (!d) return '';
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmt(d, opts) {
    try { return new Intl.DateTimeFormat(LOCALE, opts).format(d); }
    catch (e) { return ''; }
  }
  /* 2026年11月12日 星期四 / Thu, Nov 12, 2026 */
  function fullDate(s) {
    var d = parseYmd(s);
    if (!d) return '';
    if (lang === 'zh') {
      return fmt(d, { year:'numeric', month:'long', day:'numeric' }) + ' ' + fmt(d, { weekday:'long' });
    }
    return fmt(d, { weekday:'short', month:'short', day:'numeric', year:'numeric' });
  }
  /* 11月9日 / Nov 9 */
  function shortDate(s) {
    var d = parseYmd(s);
    if (!d) return '';
    return fmt(d, { month: lang === 'zh' ? 'long' : 'short', day:'numeric' });
  }
  /* 周四 / Thu */
  function weekdayShort(s) {
    var d = parseYmd(s);
    if (!d) return '';
    return fmt(d, { weekday:'short' });
  }
  /* 3 天前 / 3 days ago（负数 = 未来） */
  function relText(ago) {
    if (lang === 'zh') return ago >= 0 ? t('rel.ago', { n: ago }) : t('rel.in', { n: Math.abs(ago) });
    try {
      return new Intl.RelativeTimeFormat('en', { numeric:'always' }).format(-ago, 'day');
    } catch (e) {
      return t('rel.ago', { n: ago });
    }
  }

  /* ================= 元素 ================= */
  var tv = document.getElementById('tv');
  var titleEl = document.getElementById('title');
  var subDateEl = document.getElementById('subDate');
  var relChip = document.getElementById('relChip');
  var syncChip = document.getElementById('syncChip');
  var daysEl = document.getElementById('days');
  var figureEl = document.getElementById('figure');
  var textEl = document.getElementById('text');
  var emptyBig = document.getElementById('emptyBig');
  var emptySmall = document.getElementById('emptySmall');
  var udHint = document.getElementById('udHint');
  var viewer = document.getElementById('viewer');
  var vimg = document.getElementById('vimg');
  var vph = document.getElementById('vph');
  var demoBadge = document.getElementById('demoBadge');
  var langToggle = document.getElementById('langToggle');

  var BASE_KEY = 'tzg.base';
  var base = '';
  try { base = localStorage.getItem(BASE_KEY) || ''; } catch (e) { base = ''; }
  base = String(base).trim().replace(/\/+$/, '');

  var S = {
    mock: /[?&]mock=1/.test(location.search),
    mockAuto: false,
    today: null,
    sel: null,
    weekStart: null,
    day: null,
    days: [],
    subjIdx: 0,
    imgIdx: 0,
    stamp: null,
    offline: false,
    noData: false,
    viewer: false,
    vy: 0,
    imgTouched: false   // 按过 ↑↓ 之后才在网格里标出「当前这张」
  };

  /* ================= 语言 ================= */
  function applyStatic() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    document.title = t('page.title');

    var i, el;
    var texts = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < texts.length; i++) {
      el = texts[i];
      el.textContent = t(el.getAttribute('data-i18n'));
    }
    var phs = document.querySelectorAll('[data-i18n-placeholder]');
    for (i = 0; i < phs.length; i++) {
      el = phs[i];
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
    }
    var alts = document.querySelectorAll('[data-i18n-alt]');
    for (i = 0; i < alts.length; i++) {
      el = alts[i];
      el.setAttribute('alt', t(el.getAttribute('data-i18n-alt')));
    }
    var arms = document.querySelectorAll('[data-i18n-aria]');
    for (i = 0; i < arms.length; i++) {
      el = arms[i];
      el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
    }
    var titles = document.querySelectorAll('[data-i18n-title]');
    for (i = 0; i < titles.length; i++) {
      el = titles[i];
      el.setAttribute('title', t(el.getAttribute('data-i18n-title')));
    }
    var opts = langToggle.querySelectorAll('[data-lang]');
    for (i = 0; i < opts.length; i++) {
      opts[i].classList.toggle('on', opts[i].getAttribute('data-lang') === lang);
    }
  }

  function refreshLang() {
    applyStatic();
    if (S.day) render(); else renderNoData();
  }

  function setLang(next) {
    if (next !== 'zh' && next !== 'en') return;
    lang = next;
    LOCALE = lang === 'zh' ? 'zh-CN' : 'en-US';
    try { localStorage.setItem(LS_LANG, lang); } catch (e) { /* 隐私模式 */ }
    refreshLang();
    renderWeek();
  }

  langToggle.onclick = function () { setLang(lang === 'zh' ? 'en' : 'zh'); };

  /* ================= 缓存 ================= */
  function writeCache(key, data) {
    try { sessionStorage.setItem('tzg:' + key, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
  }
  function readCache(key) {
    try {
      var raw = sessionStorage.getItem('tzg:' + key);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return (o && o.data) ? o : null;
    } catch (e) { return null; }
  }

  /* ================= 取数据 ================= */
  function url(path) { return base + path; }

  function getJSON(path) {
    if (S.mock) return Promise.resolve(mockGet(path));
    return new Promise(function (resolve, reject) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 6000);
      fetch(url(path), ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(resolve).catch(function (err) {
        clearTimeout(timer);
        if (location.protocol === 'file:' && !S.mock) {
          enableMock();
          resolve(mockGet(path));
          return;
        }
        reject(err);
      });
    });
  }

  function enableMock() {
    if (S.mock) return;
    S.mock = true;
    S.mockAuto = true;
    demoBadge.classList.add('on');
  }

  function setLoading(on) {
    tv.classList.toggle('loading', !!on);
  }

  /* 主数据：某天作业。date 为空 = 服务端今天 */
  function loadDay(date, silent) {
    var q = date ? ('?date=' + encodeURIComponent(date)) : '';
    if (!silent) setLoading(true);
    return getJSON('/api/day' + q).then(function (d) {
      if (!d || !d.date) throw new Error('bad response');
      var same = S.day && S.day.date === d.date;
      S.day = d;
      S.offline = false;
      S.noData = false;
      S.stamp = new Date();
      if (d.is_today) S.today = d.date;
      if (!S.today) S.today = d.date;
      S.sel = d.date;
      S.weekStart = mondayOf(d.date);
      if (!same) { S.subjIdx = 0; S.imgIdx = 0; S.imgTouched = false; }
      clampIdx();
      writeCache('day:' + d.date, d);
      setLoading(false);
      render();
      return d;
    }).catch(function () {
      // 失败：有缓存就显示缓存 + 「上次更新」
      var cached = readCache('day:' + (date || S.sel || S.today));
      if (cached && cached.data) {
        S.day = cached.data;
        S.offline = true;
        S.noData = false;
        S.stamp = new Date(cached.ts);
        S.sel = cached.data.date;
        S.weekStart = mondayOf(cached.data.date);
        clampIdx();
        setLoading(false);
        render();
      } else {
        S.offline = true;
        S.noData = true;
        S.day = null;
        setLoading(false);
        render();
      }
      return null;
    });
  }

  function loadWeek() {
    var from = S.weekStart || mondayOf(S.sel || todayYmd());
    var to = addDays(from, 6);
    var key = 'days:' + from;
    function apply(days) {
      S.days = days || [];
      writeCache(key, S.days);
      renderWeek();
    }
    if (S.mock) { apply(mockDays(from, to)); return; }
    getJSON('/api/days?from=' + from + '&to=' + to).then(function (d) {
      apply((d && d.days) || []);
    }).catch(function () {
      var cached = readCache(key);
      apply(cached ? cached.data : []);
    });
  }

  function clampIdx() {
    var d = S.day;
    if (!d) return;
    var n = (d.subjects || []).length;
    if (n) S.subjIdx = Math.max(0, Math.min(n - 1, S.subjIdx)); else S.subjIdx = 0;
    var m = (d.images || []).length;
    if (m) S.imgIdx = Math.max(0, Math.min(m - 1, S.imgIdx)); else S.imgIdx = 0;
  }

  /* ================= 渲染 ================= */
  function render() {
    if (!S.day) { renderNoData(); return; }
    var d = S.day;
    var ago = (typeof d.days_ago === 'number') ? d.days_ago : diffDays(S.today || d.date, d.date);

    titleEl.textContent = (d.is_today || ago === 0)
      ? t('tv.title.today')
      : (ago === 1 ? t('tv.title.yesterday') : t('tv.title.other', { d: shortDate(d.date) }));
    subDateEl.textContent = fullDate(d.date);

    if (ago > 1) {
      relChip.textContent = relText(ago);
      relChip.style.display = '';
    } else if (ago < 0) {
      relChip.textContent = relText(ago);
      relChip.style.display = '';
    } else {
      relChip.style.display = 'none';
    }

    syncChip.className = 'chip' + (S.offline ? ' stale' : '');
    syncChip.textContent = S.stamp
      ? (S.offline ? t('tv.sync.updated', { time: hm(S.stamp) }) : t('tv.sync.synced', { time: hm(S.stamp) }))
      : t('tv.sync.none');

    tv.classList.remove('is-empty');
    tv.classList.remove('loading');

    if (d.state === 'empty') {
      emptyBig.textContent = d.is_today ? t('tv.empty.today') : t('tv.empty.day');
      emptySmall.textContent = t('tv.empty.sub');
      tv.classList.add('is-empty');
      setUd(t('foot.subject'));
      renderWeek();
      return;
    }

    if (d.state === 'pending' || !(d.subjects || []).length) {
      renderPending(d);
      renderWeek();
      return;
    }

    renderReady(d);
    renderWeek();
  }

  function renderNoData() {
    titleEl.textContent = t('tv.title.today');
    subDateEl.textContent = '';
    relChip.style.display = 'none';
    syncChip.className = 'chip stale';
    syncChip.textContent = t('tv.nas.title');
    emptyBig.textContent = t('tv.nodata.title');
    emptySmall.textContent = t('tv.nodata.sub');
    tv.classList.add('is-empty');
    renderWeek();
  }

  function renderReady(d) {
    var subjects = d.subjects || [];
    var s = subjects[S.subjIdx];
    if (!s) { renderPending(d); return; }
    var items = s.items || [];
    var imgUrl = s.image_url || pickImage(d, S.subjIdx);
    var subj = subjectName(s.subject);

    figureEl.textContent = '';
    var photo = document.createElement('div');
    photo.className = 'photo';

    if (imgUrl) {
      var img = document.createElement('img');
      img.alt = t('tv.ready.alt', { subject: subj || t('tv.ready.fallback') });
      img.onerror = function () {
        photo.textContent = '';
        photo.appendChild(placeholder(t('tv.ready.imgfail'), t('tv.ready.imgfail.sub')));
      };
      img.src = resolveImg(imgUrl);
      photo.appendChild(img);
    } else {
      photo.appendChild(placeholder(t('tv.ready.noimg'), ''));
    }

    var tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = subj + ' ' + (S.subjIdx + 1) + ' / ' + subjects.length;
    photo.appendChild(tag);
    figureEl.appendChild(photo);

    textEl.textContent = '';
    var head = document.createElement('div');
    head.className = 'subject';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = subj || t('tv.ready.fallback');
    var idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = t('tv.idx', { i: S.subjIdx + 1, n: subjects.length });
    head.appendChild(name); head.appendChild(idx);

    var rule = document.createElement('div');
    rule.className = 'rule';

    var lines = document.createElement('div');
    lines.className = 'lines';
    if (!items.length) {
      var p0 = document.createElement('p');
      p0.className = 'muted';
      p0.textContent = t('tv.ready.noitems');
      lines.appendChild(p0);
    } else {
      items.forEach(function (it, i) {
        var p = document.createElement('p');
        var n = document.createElement('span');
        n.className = 'num';
        n.textContent = i + 1;
        p.appendChild(n);
        p.appendChild(document.createTextNode(it.content || ''));
        lines.appendChild(p);
      });
    }

    var cap = document.createElement('div');
    cap.className = 'caption';
    cap.innerHTML = t('tv.ready.caption');

    textEl.appendChild(head);
    textEl.appendChild(rule);
    textEl.appendChild(lines);
    textEl.appendChild(cap);
    setUd(t('foot.subject'));
  }

  function renderPending(d) {
    var images = d.images || [];
    figureEl.textContent = '';

    var grid = document.createElement('div');
    grid.className = 'grid';
    var cols = Math.min(3, Math.max(1, images.length));
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    if (!images.length) {
      grid.style.gridTemplateColumns = '1fr';
      var none = document.createElement('div');
      none.className = 'cell';
      none.appendChild(placeholder(t('tv.pending.noimg'), t('tv.pending.noimg.sub')));
      grid.appendChild(none);
    } else {
      images.forEach(function (im, i) {
        var cell = document.createElement('div');
        cell.className = 'cell' + (S.imgTouched && i === S.imgIdx ? ' cur' : '');
        var img = document.createElement('img');
        img.alt = t('tv.pending.imgalt', { n: i + 1 });
        img.onerror = function () {
          cell.textContent = '';
          cell.appendChild(placeholder(t('tv.pending.cellfail'), ''));
        };
        img.src = resolveImg(im.url);
        cell.appendChild(img);
        cell.onclick = function () { S.imgIdx = i; S.imgTouched = true; renderPending(S.day); };
        grid.appendChild(cell);
      });
    }
    figureEl.appendChild(grid);

    textEl.textContent = '';
    var head = document.createElement('div');
    head.className = 'subject';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = t('tv.pending.name');
    var idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = images.length ? t('tv.pending.idx', { i: S.imgIdx + 1, n: images.length }) : '';
    head.appendChild(name); head.appendChild(idx);

    var rule = document.createElement('div');
    rule.className = 'rule';

    var lines = document.createElement('div');
    lines.className = 'lines';
    var p1 = document.createElement('p');
    p1.textContent = t('tv.pending.line1');
    var p2 = document.createElement('p');
    p2.className = 'muted';
    p2.textContent = t('tv.pending.line2');
    lines.appendChild(p1); lines.appendChild(p2);

    var cap = document.createElement('div');
    cap.className = 'caption';
    cap.textContent = t('tv.pending.cap');

    textEl.appendChild(head);
    textEl.appendChild(rule);
    textEl.appendChild(lines);
    textEl.appendChild(cap);
    setUd(t('foot.subject.pending'));
  }

  function placeholder(title, sub) {
    var box = document.createElement('div');
    box.className = 'ph';
    var b = document.createElement('div');
    b.className = 'box';
    b.textContent = '!';
    var tt = document.createElement('div');
    tt.textContent = title;
    box.appendChild(b); box.appendChild(tt);
    if (sub) {
      var s = document.createElement('div');
      s.className = 't2';
      s.textContent = sub;
      box.appendChild(s);
    }
    return box;
  }

  function pickImage(d, i) {
    var images = d.images || [];
    if (!images.length) return '';
    return (images[i] || images[0]).url;
  }

  function resolveImg(u) {
    if (!u) return '';
    if (/^(data:|blob:|https?:)/i.test(u)) return u;
    return base + u;
  }

  function setUd(text) { udHint.textContent = text; }

  /* ================= 日期条 ================= */
  function renderWeek() {
    daysEl.textContent = '';
    var start = S.weekStart || mondayOf(S.sel || todayYmd());
    var map = {};
    (S.days || []).forEach(function (m) { if (m && m.date) map[m.date] = m; });

    for (var i = 0; i < 7; i++) {
      var ds = addDays(start, i);
      var dt = parseYmd(ds);
      var el = document.createElement('div');
      el.className = 'day';
      if (ds === S.today) el.className += ' today';
      if (ds === S.sel) el.className += ' sel';
      if (S.today && ds > S.today) el.className += ' future';

      var w = document.createElement('div');
      w.className = 'w';
      w.textContent = weekdayShort(ds);
      var dnum = document.createElement('div');
      dnum.className = 'd';
      dnum.textContent = dt.getDate();
      el.appendChild(w); el.appendChild(dnum);

      var mark = map[ds];
      if (mark && mark.has) {
        var dot = document.createElement('div');
        dot.className = 'dot';
        el.appendChild(dot);
      }

      el.setAttribute('data-date', ds);
      el.onclick = (function (date) {
        return function () { selectDate(date); };
      })(ds);

      daysEl.appendChild(el);
    }
  }

  /* ================= 导航 ================= */
  function selectDate(date) {
    if (!date) return;
    S.sel = date;
    var nw = mondayOf(date);
    var weekChanged = nw !== S.weekStart;
    S.weekStart = nw;
    renderWeek();
    if (weekChanged) loadWeek();
    loadDay(date);
  }

  function moveDate(dir) {
    if (S.viewer) return;
    selectDate(addDays(S.sel, dir));
  }

  function moveSubject(dir) {
    if (S.viewer || !S.day) return;
    var d = S.day;
    if (d.state === 'ready' && (d.subjects || []).length) {
      var n = d.subjects.length;
      S.subjIdx = Math.max(0, Math.min(n - 1, S.subjIdx + dir));
      renderReady(d);
      renderWeek();
    } else if (d.state === 'pending' && (d.images || []).length) {
      var m = d.images.length;
      S.imgTouched = true;
      S.imgIdx = Math.max(0, Math.min(m - 1, S.imgIdx + dir));
      renderPending(d);
      renderWeek();
    }
  }

  /* ================= 全屏看图 ================= */
  function currentImage() {
    var d = S.day;
    if (!d) return '';
    if (d.state === 'ready') {
      var s = (d.subjects || [])[S.subjIdx];
      return s ? (s.image_url || pickImage(d, S.subjIdx)) : '';
    }
    return pickImage(d, S.imgIdx);
  }

  function openViewer(u) {
    if (!u) return;
    S.viewer = true;
    S.vy = 0;
    viewer.classList.add('on');
    vimg.style.display = 'block';
    vph.style.display = 'none';
    vimg.style.transform = 'translate(-50%,0)';
    vimg.style.top = '0px';
    vimg.onerror = function () {
      vimg.style.display = 'none';
      vph.style.display = 'flex';
    };
    vimg.onload = function () {
      vimg.style.display = 'block';
      vph.style.display = 'none';
      fitViewer();
    };
    vimg.src = resolveImg(u);
    if (vimg.complete && vimg.naturalWidth) fitViewer();
  }

  function fitViewer() {
    if (!vimg.naturalWidth) return;
    var ih = vimg.offsetHeight;
    var vh = 1080 - 88;
    vimg.style.top = (ih < vh ? Math.round((vh - ih) / 2) : 0) + 'px';
    vimg.style.transform = 'translate(-50%,0)';
    S.vy = 0;
  }

  function scrollViewer(delta) {
    var ih = vimg.offsetHeight;
    var vh = 1080 - 88;
    var max = Math.max(0, ih - vh);
    S.vy = Math.max(-max, Math.min(0, S.vy + delta));
    vimg.style.transform = 'translate(-50%,' + S.vy + 'px)';
  }

  function closeViewer() {
    S.viewer = false;
    viewer.classList.remove('on');
    vimg.removeAttribute('src');
  }

  /* ================= 键位 ================= */
  document.addEventListener('keydown', function (e) {
    var k = e.key;

    if (S.viewer) {
      if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack') {
        closeViewer();
      } else if (k === 'ArrowUp') {
        scrollViewer(180);
      } else if (k === 'ArrowDown') {
        scrollViewer(-180);
      } else {
        return;
      }
      e.preventDefault();
      return;
    }

    if (k === 'ArrowLeft') { moveDate(-1); }
    else if (k === 'ArrowRight') { moveDate(1); }
    else if (k === 'ArrowUp') { moveSubject(-1); }
    else if (k === 'ArrowDown') { moveSubject(1); }
    else if (k === 'Enter' || k === ' ') { openViewer(currentImage()); }
    else return;
    e.preventDefault();
  });

  document.getElementById('prevWeek').onclick = function () { moveDate(-7); };
  document.getElementById('nextWeek').onclick = function () { moveDate(7); };

  /* ================= 缩放 ================= */
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  /* ================= Mock ================= */
  var IMG_CACHE = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function board(title, lines) {
    var w = 900, h = 1200;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<rect width="100%" height="100%" fill="#203A2C"/>' +
      '<rect x="36" y="36" width="' + (w - 72) + '" height="' + (h - 72) + '" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/>' +
      '<text x="70" y="150" fill="#EAF2E6" font-size="46" font-weight="700" font-family="Noto Sans CJK SC,Noto Serif CJK SC,sans-serif">' + esc(title) + '</text>' +
      '<line x1="70" y1="190" x2="' + (w - 70) + '" y2="190" stroke="rgba(255,255,255,.18)" stroke-width="2"/>';
    lines.forEach(function (l, i) {
      svg += '<text x="70" y="' + (280 + i * 108) + '" fill="#DFEADD" font-size="36" font-family="Noto Sans CJK SC,Noto Serif CJK SC,sans-serif">' + esc(l) + '</text>';
    });
    svg += '<text x="70" y="' + (h - 70) + '" fill="#9DB3A5" opacity=".55" font-size="26" font-family="Noto Sans CJK SC,Noto Serif CJK SC,sans-serif">演示图片 · 不是真实作业</text>';
    svg += '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function mockImages() {
    if (IMG_CACHE) return IMG_CACHE;
    IMG_CACHE = [
      { id: 1, url: board('语文 · 第 32 页', ['1. 朗读课文三遍', '2. 抄写生字「秋 风 叶」', '3. 背诵第一自然段']), width: 900, height: 1200 },
      { id: 2, url: board('数学 · 练习册 P18', ['1. 第 1—6 题', '2. 口算本一页，计时 5 分钟', '3. 家长签字']), width: 900, height: 1200 },
      { id: 3, url: board('英语 · Unit 4', ['1. 跟读音频三遍', '2. 抄写 each / both / never', '3. 背会三个单词']), width: 900, height: 1200 }
    ];
    return IMG_CACHE;
  }

  function item(id, content) { return { id: id, content: content, done: false }; }

  function mockDay(date) {
    var td = todayYmd();
    var ago = diffDays(td, date);
    var imgs = mockImages();
    if (ago === 0) {
      return {
        date: date, is_today: true, days_ago: 0, state: 'ready', note: '今天作业在黑板上了',
        images: imgs.slice(),
        subjects: [
          { subject: '语文', image_url: imgs[0].url, items: [item(1, '朗读第 32 页课文三遍'), item(2, '抄写生字「秋、风、叶」各两遍'), item(3, '背诵第一自然段')] },
          { subject: '数学', image_url: imgs[1].url, items: [item(4, '练习册 P18，第 1—6 题'), item(5, '口算本一页，计时 5 分钟'), item(6, '错的题在下面重写一遍'), item(7, '家长签字')] },
          { subject: '英语', image_url: imgs[2].url, items: [item(8, '跟读 Unit 4 音频三遍'), item(9, '抄写单词 each、both、never 各三遍')] },
          { subject: '美术', image_url: imgs[0].url, items: [item(10, '画一张秋天的树叶')] }
        ],
        batch_ids: [318]
      };
    }
    if (ago === 1) {
      return {
        date: date, is_today: false, days_ago: 1, state: 'pending', note: null,
        images: imgs.slice(0, 2), subjects: [], batch_ids: [317]
      };
    }
    if (ago === 3) {
      return {
        date: date, is_today: false, days_ago: 3, state: 'ready', note: null,
        images: [imgs[0]],
        subjects: [
          { subject: '语文', image_url: imgs[0].url, items: [item(11, '默写《秋天》第一段'), item(12, '读课外书 20 分钟')] }
        ],
        batch_ids: [316]
      };
    }
    return { date: date, is_today: false, days_ago: ago, state: 'empty', images: [], subjects: [], batch_ids: [] };
  }

  function mockDays(from, to) {
    var out = [];
    var n = diffDays(to, from);
    for (var i = 0; i <= n; i++) {
      var ds = addDays(from, i);
      var ago = diffDays(todayYmd(), ds);
      var has = (ago === 0 || ago === 1 || ago === 3);
      out.push({ date: ds, has: has, item_count: has ? (ago === 0 ? 9 : 0) : 0 });
    }
    return out;
  }

  function parseQuery(path) {
    var q = {};
    var i = path.indexOf('?');
    if (i < 0) return q;
    path.slice(i + 1).split('&').forEach(function (kv) {
      if (!kv) return;
      var p = kv.split('=');
      q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    return q;
  }

  function mockGet(path) {
    var p = path.split('?')[0];
    var q = parseQuery(path);
    if (p === '/api/day') return mockDay(q.date || todayYmd());
    if (p === '/api/days') {
      var from = q.from || mondayOf(S.sel || todayYmd());
      var to = q.to || addDays(from, 6);
      return { days: mockDays(from, to) };
    }
    if (p === '/api/health') return { ok: true, version: 'mock', time: new Date().toISOString(), db: 'ok', ocr: 'ok' };
    return {};
  }

  /* ================= 启动 ================= */
  if (S.mock) demoBadge.classList.add('on');

  (function boot() {
    applyStatic();
    fit();
    var local = todayYmd();
    S.today = local;
    S.sel = local;
    S.weekStart = mondayOf(local);
    renderWeek();

    // 调试用：?date=YYYY-MM-DD 直接看某天
    var qDate = parseQuery(location.search).date || '';
    if (qDate && /^\d{4}-\d{2}-\d{2}$/.test(qDate)) S.sel = qDate;

    loadDay(qDate || null).then(function () {
      renderWeek();
      loadWeek();
    });

    // 电视一直开着：20 秒静默刷新一次，识别完的文字会自己出现
    setInterval(function () {
      if (S.viewer || document.hidden) return;
      if (!S.day) return;
      loadDay(S.sel, true).then(function () {});
    }, 20000);
  })();
})();
</script>
