<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bb" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#35684E"/>
      <stop offset="0.55" stop-color="#2A5440"/>
      <stop offset="1" stop-color="#1F4030"/>
    </linearGradient>
    <radialGradient id="bg2" cx="0.2" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="180" fill="url(#bb)"/>
  <rect x="0" y="0" width="320" height="180" fill="url(#bg2)"/>

  <!-- 田字格 -->
  <g transform="translate(34,32)">
    <rect x="0" y="0" width="116" height="116" rx="8"
          fill="none" stroke="#F2F5F8" stroke-width="7" stroke-opacity="0.95"/>
    <line x1="58" y1="0" x2="58" y2="116" stroke="#F2F5F8" stroke-width="7" stroke-opacity="0.95"/>
    <line x1="0" y1="58" x2="116" y2="58" stroke="#F2F5F8" stroke-width="7" stroke-opacity="0.95"/>
    <path d="M74 86 L86 98 L106 74" fill="none" stroke="#E4574F"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右侧：黑板上的三行作业 -->
  <g fill="#F2F5F8" stroke-linecap="round">
    <rect x="180" y="52"  width="104" height="9" rx="4.5" opacity="0.92"/>
    <rect x="180" y="84"  width="118" height="9" rx="4.5" opacity="0.72"/>
    <rect x="180" y="116" width="76"  height="9" rx="4.5" opacity="0.50"/>
  </g>

  <!-- 今日圆点 -->
  <circle cx="288" cy="140" r="7" fill="#E9B44C" opacity="0.9"/>
</svg>
